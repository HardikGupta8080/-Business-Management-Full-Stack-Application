# Same Postgres database/schema the FastAPI backend (backend/) uses, so this
# Spring Boot backend is a drop-in alternative implementation of the same
# API contract — either backend can serve the same web/native apps.
#
# NOTE: unlike the FastAPI backend's DATABASE_URL (postgresql://... scheme),
# JDBC needs the jdbc:postgresql://... scheme, so this intentionally uses
# Spring Boot's own standard env vars (SPRING_DATASOURCE_URL/USERNAME/PASSWORD)
# rather than reusing backend/.env's DATABASE_URL directly.
spring.datasource.url=jdbc:postgresql://localhost:5432/emergent_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# "update" so a fresh database gets all tables created automatically, while
# an existing database (e.g. one already populated by the FastAPI backend)
# keeps its data. The 8 mirror tables are still fully rebuilt from
# app_config on every write via ConfigSyncService, same as the Python backend.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.globally_quoted_identifiers=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Different default port than the FastAPI backend (8000) so both backends
# can run side-by-side on the same machine, each with their own native app
# pointed at it (android-native -> FastAPI:8000, android-native-springboot ->
# Spring Boot:8081).
server.port=${SERVER_PORT:8081}
server.address=0.0.0.0

# Matches the FastAPI backend's CORS_ORIGINS env var (comma-separated list, "*" = allow all)
app.cors.allowed-origins=${CORS_ORIGINS:*}

spring.jackson.default-property-inclusion=non_null
